services:
    postgres:
        image: postgres:17
        container_name: matcom_bench_press_postgres
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
    mongo:
        image: mongo:8.0
        container_name: matcom_bench_press_mongo
        restart: unless-stopped
        ports:
            - "${MONGO_PORT}:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${POSTGRES_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - mongo-data:/data/db
volumes:
    postgres_data:
    mongo-data: